<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <title>CarValue AI • Used Car Price Predictor</title>
    <!-- FontAwesome & Google Fonts -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Bootstrap 4.6 CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css">
    <!-- Custom Dark Glassmorphism CSS -->
    <link rel="stylesheet" href="/static/css/style.css">
  </head>
  <body>
    <nav class="navbar navbar-expand-lg navbar-dark navbar-glass sticky-top py-3">
      <div class="container">
        <a class="navbar-brand d-flex align-items-center" href="/">
          <i class="fa-solid fa-car-side mr-2 text-cyan"></i>
          <span>CarValue<span class="text-white">.AI</span></span>
        </a>
        <button class="navbar-toggler border-0" type="button" data-toggle="collapse" data-target="#nav" aria-controls="nav" aria-expanded="false" aria-label="Toggle navigation">
          <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="nav">
          <ul class="navbar-nav ml-auto align-items-center">
            <li class="nav-item px-2"><a class="nav-link {% if request.path == '/' %}active{% endif %}" href="/"><i class="fa-solid fa-house mr-1"></i> Home</a></li>
            <li class="nav-item px-2"><a class="nav-link {% if request.path == '/predict' %}active{% endif %}" href="/predict"><i class="fa-solid fa-wand-magic-sparkles mr-1"></i> Predict</a></li>
            <li class="nav-item px-2"><a class="nav-link {% if request.path == '/dashboard' %}active{% endif %}" href="/dashboard"><i class="fa-solid fa-chart-line mr-1"></i> Dashboard</a></li>
            <li class="nav-item pl-3">
              <a href="/predict" class="btn btn-cyan btn-sm"><i class="fa-solid fa-bolt mr-1"></i> Estimate Price</a>
            </li>
          </ul>
        </div>
      </div>
    </nav>

    <main role="main" class="container mt-4 mb-5">
      {% block content %}{% endblock %}
    </main>

    <footer class="footer">
      <div class="container text-center">
        <div class="row align-items-center">
          <div class="col-md-6 text-md-left mb-2 mb-md-0">
            <span>© 2026 CarValue AI • Powered by Machine Learning & Flask</span>
          </div>
          <div class="col-md-6 text-md-right">
            <a href="/api/meta" target="_blank" class="text-muted mr-3"><i class="fa-solid fa-code mr-1"></i> API Meta</a>
            <a href="/api/history" target="_blank" class="text-muted mr-3"><i class="fa-solid fa-database mr-1"></i> API History</a>
            <a href="/api/export-csv" class="text-muted"><i class="fa-solid fa-file-csv mr-1"></i> Export CSV</a>
          </div>
        </div>
      </div>
    </footer>

    <script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/static/js/main.js"></script>
    {% block scripts %}{% endblock %}
  </body>
</html>
